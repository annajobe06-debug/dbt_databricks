snapshots:
  - name: gold_items
    relation: ref('source_gold_items')
    config:
      schema: gold
      database: dbt_tut_dev
      unique_key: id
      strategy: timestamp # there is 2 types of strategies (check, timestamp) dbt recommennd to use timestamp
      updated_at: updateDate
      dbt_valid_to_current: "to_date('9999-12-31')" # Specifies that current records should have `dbt_valid_to` set to `'9999-12-31'` instead of `NULL`.