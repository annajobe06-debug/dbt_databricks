
version: 2

models:
  - name: bronze_date
    config:
      materialized: table

  - name: bronze_product
    config:
      materialized: table
    columns:
      - name: product_sk
        data_tests:
          - unique
          - not_null

  - name: bronze_sales # This is the model
    columns:
      - name: sales_id
        data_tests:
          - unique
          - not_null
      - name: store_sk
        data_tests:
          - not_null
      - name: gross_amount # This the column_name
        data_tests:
          - generic_check_positive # dbt automatically passes the model and column_name parameters

  - name: bronze_store
    columns:
      - name: store_name
        data_tests:
          - accepted_values:
              arguments:
                values: ['MegaMart Manhattan', 'MegaMart Brooklyn', 'MegaMart Austin', 'MegaMart San Jose', 'MegaMart Toronto']
              config:
                severity: warn

